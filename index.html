<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta content="initial-scale=1.0,width=device-width" name="viewport">

	<title>Bagol</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Itim&display=swap" rel="stylesheet">

	<link href="css/reset.css" rel="stylesheet" type="text/css">
	<link href="css/styles.css" rel="stylesheet" type="text/css">

	<script src="js/scripts.js" defer></script>

	<link rel="icon" type="image/png" href="/https://project5.ixp2.kayleypark.com/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/https://project5.ixp2.kayleypark.com/favicon.svg" />
	<link rel="shortcut icon" href="/https://project5.ixp2.kayleypark.com/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/https://project5.ixp2.kayleypark.com/apple-touch-icon.png" />
	<meta name="apple-mobile-web-app-title" content="Bagol" />
	<link rel="manifest" href="/https://project5.ixp2.kayleypark.com/site.webmanifest" />
</head>

<body>

	<header class="site-header">

		<div class="logo">
			<h1 class="logo__text">
				BAG<img class="logo__mascot" src="images/mascot.png" alt="o">L
			</h1>
		</div>

		<p class="site-tagline">my hole-hearted love for bagels</p>

	</header>

	<main class="wrapper">

		<p class="intro">trying bagels around pasadena. i like some more than others. here's where i write about the ones i try</p>

		<section class="munching">

			<p class="munching__label">heres where ive been munching</p>
		</section>

	</main>

	<section class="map-section">

		<div class="map-wrap">
			<img class="map" src="images/map2.png" alt="map">
			<svg class="map-pins" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">

				<image class="map-pin" data-index="0" href="images/pin.png" x="50" y="80" width="30" height="36" style="cursor:pointer;"/>
				<image class="map-pin" data-index="1" href="images/pin.png" x="165" y="120" width="30" height="36" style="cursor:pointer;"/>
				<image class="map-pin" data-index="2" href="images/pin.png" x="225" y="130" width="30" height="36" style="cursor:pointer;"/>
				<image class="map-pin" data-index="3" href="images/pin.png" x="290" y="70" width="30" height="36" style="cursor:pointer;"/>
				<image class="map-pin" data-index="4" href="images/pin.png" x="220" y="180" width="30" height="36" style="cursor:pointer;"/>
			</svg>

			<a class="map-card" id="map-card" href="">
				<div class="map-card__top">
					<img class="map-card__title" id="map-card-img1" src="" alt="">
				</div>
				<img class="map-card__hand" id="map-card-img2" src="" alt="">
			</a>

		</div>

	</section>

	<footer class="site-footer">
		<p class="site-footer__copy">© 2026 Bagol. All Rights Reserved.</p>
	</footer>

</body>
</html>
